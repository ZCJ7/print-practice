<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Print 指纹变化示例</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #f4efe6;
      color: #2f2c28;
      padding: 28px 16px 48px;
    }
    .top { max-width: 980px; margin: 0 auto 28px; }
    .brand { letter-spacing: 0.18em; color: #8d877c; font-size: 14px; }
    h1 { margin-top: 10px; font-size: 24px; font-weight: 600; }
    .lead { margin-top: 10px; line-height: 1.7; color: #6f6a62; font-size: 14px; }
    .links { margin-top: 16px; }
    .links a { color: #6f6a62; margin-right: 18px; }
    .morph {
      display: block;
      width: 100%;
      max-width: 360px;
      margin: 20px auto 0;
      border-radius: 18px;
      background: #fffdf8;
    }
    .section { max-width: 980px; margin: 0 auto 36px; }
    h2 { font-size: 17px; letter-spacing: 0.04em; }
    .note { margin-top: 8px; font-size: 13px; line-height: 1.7; color: #8a8378; }
    .row {
      display: flex;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin-top: 16px;
      padding-bottom: 6px;
    }
    .card { flex: 0 0 180px; text-align: center; }
    .card + .card { margin-left: 14px; }
    canvas {
      display: block;
      width: 180px;
      height: 180px;
      background: #fffdf8;
      border-radius: 16px;
    }
    strong { display: block; margin-top: 10px; font-size: 14px; }
    span { display: block; margin-top: 4px; font-size: 12px; color: #8a8378; }
  </style>
</head>
<body>
  <div class="top">
    <p class="brand">Print</p>
    <h1>指纹变化示例</h1>
    <p class="lead">累计越长，单次越不容易磨、恢复越快。茧只看累计时长；单次磨损最多按两小时算，超过两小时累计仍继续记。恢复按天：新手大约五天，老手至少半天。</p>
    <p class="links">
      <a href="./index.html">打开练习页</a>
      <a href="./animate.html">渐变动画</a>
    </p>
    <img class="morph" src="./examples/print-morph.gif" alt="指纹从练习到休息再到长茧的循环变化" />
  </div>
  <div id="gallery"></div>
  <script src="./assets/examples.js"></script>
</body>
</html>
